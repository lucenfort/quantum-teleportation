<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgQuantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080616" />
      <stop offset="50%" stop-color="#140e2e" />
      <stop offset="100%" stop-color="#04030d" />
    </linearGradient>

    <linearGradient id="neonQuantumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A3FFC" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1000" height="250" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-8px, 6px); opacity: 0.6; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes spinBloch {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseQubit {
      0%, 100% { r: 4px; opacity: 0.8; }
      50% { r: 7px; opacity: 1; }
    }
    @keyframes entangleLine {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.4; }
      50% { stroke-dashoffset: -20; opacity: 0.9; }
    }

    .orb-purple { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 150px 80px; }
    .orb-cyan { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 850px 150px; }
    .shimmer-line { animation: shimmerMove 4s linear infinite; }

    .bloch-vector { animation: spinBloch 8s linear infinite; transform-origin: 870px 90px; }
    .qubit-node { animation: pulseQubit 2s ease-in-out infinite; }
    .qubit-node-delay { animation: pulseQubit 2s ease-in-out infinite 0.7s; }
    .entangle-dash { stroke-dasharray: 4, 4; animation: entangleLine 2s linear infinite; }

    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 400; }
    .mono-text { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1000" height="250" fill="url(#bgQuantum)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="70" r="140" fill="#8A3FFC" opacity="0.22" class="orb-purple" filter="url(#neonGlow)" />
    <circle cx="850" cy="140" r="160" fill="#00F0FF" opacity="0.18" class="orb-cyan" filter="url(#neonGlow)" />
    <circle cx="500" cy="30" r="100" fill="#3A86FF" opacity="0.12" class="orb-purple" filter="url(#neonGlow)" />

    <!-- Technical Grid Pattern -->
    <g opacity="0.06" stroke="#8A3FFC" stroke-width="1">
      <line x1="0" y1="50" x2="1000" y2="50" />
      <line x1="0" y1="100" x2="1000" y2="100" />
      <line x1="0" y1="150" x2="1000" y2="150" />
      <line x1="0" y1="200" x2="1000" y2="200" />
      <line x1="100" y1="0" x2="100" y2="250" />
      <line x1="250" y1="0" x2="250" y2="250" />
      <line x1="400" y1="0" x2="400" y2="250" />
      <line x1="550" y1="0" x2="550" y2="250" />
      <line x1="700" y1="0" x2="700" y2="250" />
      <line x1="850" y1="0" x2="850" y2="250" />
    </g>

    <!-- Animated Quantum Circuit & Bloch Sphere on Right -->
    <g opacity="0.85" transform="translate(710, 15)">
      <!-- Bloch Sphere / Orbital Rings -->
      <ellipse cx="160" cy="75" rx="55" ry="55" fill="none" stroke="#8A3FFC" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4" />
      <ellipse cx="160" cy="75" rx="55" ry="20" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.3" />
      <ellipse cx="160" cy="75" rx="20" ry="55" fill="none" stroke="#3A86FF" stroke-width="1" opacity="0.3" />

      <!-- Qubit Circuit Lines -->
      <line x1="10" y1="45" x2="110" y2="45" stroke="#94A3B8" stroke-width="1.2" opacity="0.5" />
      <line x1="10" y1="75" x2="110" y2="75" stroke="#94A3B8" stroke-width="1.2" opacity="0.5" />
      <line x1="10" y1="105" x2="110" y2="105" stroke="#94A3B8" stroke-width="1.2" opacity="0.5" />

      <text x="0" y="49" fill="#00F0FF" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700">|ψ⟩</text>
      <text x="0" y="79" fill="#CBD5E1" font-size="10" font-family="'JetBrains Mono', monospace">|0⟩</text>
      <text x="0" y="109" fill="#CBD5E1" font-size="10" font-family="'JetBrains Mono', monospace">|0⟩</text>

      <!-- Hadamard Gate [H] -->
      <g transform="translate(30, 65)">
        <rect x="0" y="0" width="18" height="18" rx="3" fill="#1b1236" stroke="#8A3FFC" stroke-width="1.2" />
        <text x="5" y="13" fill="#FFFFFF" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700">H</text>
      </g>

      <!-- Entanglement CNOT Gate -->
      <circle cx="65" cy="74" r="3.5" fill="#00F0FF" />
      <line x1="65" y1="74" x2="65" y2="105" stroke="#00F0FF" stroke-width="1.5" class="entangle-dash" />
      <circle cx="65" cy="105" r="7" fill="none" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="65" y1="98" x2="65" y2="112" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="58" y1="105" x2="72" y2="105" stroke="#00F0FF" stroke-width="1.2" />

      <!-- State Vector in Bloch Sphere -->
      <g class="bloch-vector" filter="url(#softGlow)">
        <line x1="160" y1="75" x2="195" y2="50" stroke="#00F0FF" stroke-width="2" />
        <circle cx="195" cy="50" r="4" fill="#00F0FF" />
      </g>

      <circle cx="160" cy="75" r="3" fill="#8A3FFC" />
    </g>

    <!-- Top Glow Accent Line with Shimmer -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#neonQuantumGrad)" />
    <rect x="0" y="0" width="250" height="3" fill="url(#shimmerGrad)" class="shimmer-line" />

    <!-- Top Badge / Header Tag -->
    <g transform="translate(60, 36)">
      <rect x="0" y="0" width="370" height="26" rx="13" fill="#1e123a" stroke="#8A3FFC" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="13" cy="13" r="4.5" fill="#00F0FF" filter="url(#softGlow)" />
      <text x="26" y="17" fill="#E2E8F0" font-size="11" class="title-text" letter-spacing="1">
        QUANTUM INFORMATION &amp; SIMULATION
      </text>
    </g>

    <!-- Main Title: QUANTUM TELEPORTATION -->
    <g transform="translate(60, 108)">
      <!-- Quantum Atom / Orbital Icon -->
      <g transform="translate(0, -32) scale(0.95)">
        <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#00F0FF" stroke-width="2" transform="rotate(30 16 16)" filter="url(#softGlow)" />
        <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#8A3FFC" stroke-width="2" transform="rotate(-30 16 16)" filter="url(#softGlow)" />
        <circle cx="16" cy="16" r="3.5" fill="#00F0FF" />
      </g>
      
      <text x="50" y="5" fill="#FFFFFF" font-size="40" class="title-text" letter-spacing="1.5">
        QUANTUM
      </text>
      <text x="280" y="5" fill="#8A3FFC" font-size="40" class="title-text" letter-spacing="1.5" filter="url(#softGlow)">
        TELEPORTATION
      </text>
    </g>

    <!-- Subtitle -->
    <text x="60" y="148" fill="#94A3B8" font-size="15" class="body-text" letter-spacing="0.5">
      Implementação e Validação Prática do Protocolo de Teletransporte Quântico via Qiskit
    </text>

    <!-- Bottom Status Badges Row -->
    <g transform="translate(60, 180)">
      <rect x="0" y="0" width="700" height="34" rx="8" fill="#0c091d" stroke="#221645" stroke-width="1" opacity="0.9" />
      
      <!-- Feature Pills -->
      <g transform="translate(20, 21)">
        <circle cx="0" cy="-3" r="4" fill="#00F0FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Python 3.9+</text>
      </g>
      
      <g transform="translate(140, 21)">
        <circle cx="0" cy="-3" r="4" fill="#8A3FFC" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Qiskit SDK</text>
      </g>

      <g transform="translate(260, 21)">
        <circle cx="0" cy="-3" r="4" fill="#3A86FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Aer Simulator</text>
      </g>

      <g transform="translate(400, 21)">
        <circle cx="0" cy="-3" r="4" fill="#10B981" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Bell States &amp; 100% Fidelity</text>
      </g>
    </g>

    <!-- Subtle Border Around Banner -->
    <rect x="0" y="0" width="1000" height="250" rx="14" fill="none" stroke="#8A3FFC" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
